{% extends "layouts/client.html" %}
{% load crispy_forms_tags %}

{% block page_tile %}
Ouvrir un compte
{% endblock %}

{% block body %}
<div class="row g-4">
  <div class="col-md-6">
    <div class="card p-4">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Ouvrir le compte</button>
      </form>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-4">
      <p class="text-muted mb-0">La création d'un compte bancaire est soumise à la validation par pièce d'identité.</p>
    </div>
  </div>
</div>
{% endblock %}
