{% extends "layouts/client.html" %}
{% load crispy_forms_tags %}

{% block page_tile %}
Dépôt
{% endblock %}

{% block body %}
<div class="row g-4">
  <div class="col-md-6">
    <div class="card p-4">
      <form method="post">
        {% csrf_token %}
        {{ form | crispy }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Valider le dépôt</button>
      </form>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-4">
      <p class="text-muted mb-0">Les dépôts en espèces se font auprès d'un agent de la banque.</p>
    </div>
  </div>
</div>
{% endblock %}
