{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/rebank.css' %}">
  <title>ReBank — {% block error_code %}Erreur{% endblock %}</title>
</head>
<body>
  <div class="rb-auth-wrapper">
    <div class="text-center">
      <div class="rb-auth-logo mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
      </div>

      <h1 style="font-size:5rem; font-weight:900; color:var(--rb-primary); margin-bottom:0;">{% block code %}{% endblock %}</h1>
      <h2 style="font-weight:700; color:var(--foreground); margin-bottom:12px;">{% block title %}{% endblock %}</h2>
      <p class="text-muted mb-4">{% block message %}{% endblock %}</p>

      <div class="d-grid gap-2" style="max-width:280px; margin:0 auto;">
        <a href="/" class="btn btn-primary">Retour à l'accueil</a>
      </div>
    </div>
  </div>
</body>
</html>
