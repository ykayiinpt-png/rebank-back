{% extends "layouts/auth_staff.html" %}
{% load crispy_forms_tags %}

{% block body %}
<h2>Vérification OTP</h2>
<p class="rb-subtitle">Un code a été envoyé à votre email</p>

<form method="post">
  {% csrf_token %}
  {{ form | crispy }}
  <button type="submit" class="btn btn-primary w-100 mt-3">Valider</button>
</form>
{% endblock %}
