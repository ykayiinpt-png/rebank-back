{% extends "layouts/base.html" %}

{% block body %}
<div class="rb-auth-wrapper">
  <div class="text-center">
    <div class="rb-auth-logo mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
    </div>
    <h1 style="font-weight:800; color:var(--foreground); margin-bottom:8px;">ReBank</h1>
    <p class="text-muted mb-4">Votre banque en ligne, simple et fiable.</p>

    <div class="d-grid gap-3" style="max-width:280px; margin:0 auto;">
      <a href="/auth/login" class="btn btn-primary">Se Connecter</a>
      <a href="/auth/register" class="btn btn-outline-primary">Créer un compte</a>
    </div>

    <p class="mt-4"><a href="/auth/password/reset" style="font-size:0.9rem;">Mot de passe oublié ?</a></p>
  </div>
</div>
{% endblock %}
