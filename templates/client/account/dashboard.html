{% extends "layouts/client.html" %}

{% block page_tile %}
Tableau de bord
{% endblock %}

{% block body %}
<div class="row g-4 mb-4">
  <div class="col-md-6">
    <div class="rb-stat-card">
      <div class="rb-stat-value">{{ account|default:"0" }}</div>
      <div class="rb-stat-label">Comptes</div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="rb-stat-card">
      <div class="rb-stat-value">{{ transactions_count|default:"0" }}</div>
      <div class="rb-stat-label">Transactions</div>
    </div>
  </div>
</div>

<div class="card p-4">
  <h5 style="font-weight:700; margin-bottom:16px;">Actions rapides</h5>
  <div class="d-flex flex-wrap gap-3">
    <a href="/account/create" class="btn btn-primary">Ouvrir un compte</a>
    <a href="/account/deposit" class="btn btn-outline-primary">Effectuer un dépôt</a>
    <a href="/account/transfer" class="btn btn-outline-primary">Faire un virement</a>
  </div>
</div>
{% endblock %}
