{% extends "layouts/auth.html" %}
{%load crispy_forms_tags%}


{% block body %}
<div class="row mb-3 text-center fs-3 fw-bold">
    <p>Réinitialiser Mot de passe</p>
</div>

<div class="row mb-3">
    <form method="post">
    {% csrf_token %}
    {{ form | crispy }}

    <button class="btn btn-md btn-success w-100" >Valider</button>
</form>
</div>

<div class="row text-end">
    <p>Vous avez déjà un compte ? <a href="/auth/login">Se Connecter</a></p>
</div>


{% endblock  %}
