{% extends "layouts/auth.html" %}
{% load crispy_forms_tags %}

{% block body %}
<h2>Mot de passe oublié</h2>
<p class="rb-subtitle">Entrez votre email pour réinitialiser votre mot de passe</p>

<form method="post">
  {% csrf_token %}
  {{ form | crispy }}
  <button type="submit" class="btn btn-primary w-100 mt-3">Valider</button>
</form>

<div class="text-center mt-3">
  <p><a href="/auth/login">Retour à la connexion</a></p>
</div>
{% endblock %}
