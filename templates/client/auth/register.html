{% extends "layouts/auth.html" %}
{% load crispy_forms_tags %}

{% block body %}
<h2>Créer un compte</h2>
<p class="rb-subtitle">Rejoignez ReBank en quelques étapes</p>

<form method="post">
  {% csrf_token %}
  {{ form | crispy }}
  <button type="submit" class="btn btn-primary w-100 mt-3">S'inscrire</button>
</form>

<div class="text-center mt-3">
  <p>Vous avez déjà un compte ? <a href="/auth/login">Se connecter</a></p>
</div>
{% endblock %}
