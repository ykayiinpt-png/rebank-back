{% extends "layouts/auth.html" %}
{% load crispy_forms_tags %}

{% block body %}
<h2>Nouveau mot de passe</h2>
<p class="rb-subtitle">Choisissez votre nouveau mot de passe</p>

<form method="post">
  {% csrf_token %}
  {{ form | crispy }}
  <button type="submit" class="btn btn-primary w-100 mt-3">Valider</button>
</form>
{% endblock %}
