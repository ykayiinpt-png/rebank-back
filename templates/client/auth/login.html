{% extends "layouts/auth.html" %}
{%load crispy_forms_tags%}


{% block body %}
<div class="row mb-3 text-center fs-3 fw-bold">
    <p>Se Connecter</p>
</div>

<div class="row mb-3">
    <form method="post">
    {% csrf_token %}
    {{ form | crispy }}

    <button class="btn btn-md btn-success w-100" >Connexion</button>
</form>
</div>

<div class="row text-end">
    <p>Vous n'avez pas de compte ? <a href="/auth/register">Créer un compte</a></p>
</div>


{% endblock  %}
